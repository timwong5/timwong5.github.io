# Theme Redefine 配置
# 文档: https://redefine-docs.ohevan.com

info:
  title: Tim Wang
  subtitle: 记录技术、工具与日常思考
  author: Tim Wang
  url: https://timwong5.github.io

defaults:
  favicon: /images/favicon.svg
  logo:
  avatar: https://github.com/timwong5.png

colors:
  primary: "#3B5BDB"
  secondary:
  default_mode: light

global:
  fonts:
    chinese:
      enable: false
      family:
      url:
    english:
      enable: false
      family:
      url:
    title:
      enable: false
      family:
      url:
  content_max_width: 1000px
  sidebar_width: 210px
  hover:
    shadow: true
    scale: false
  scroll_progress:
    bar: false
    percentage: false
  website_counter:
    url: https://cn.vercount.one/js
    enable: false
    site_pv: false
    site_uv: false
    post_pv: false
  single_page: true
  preloader:
    enable: false
    custom_message:
  side_tools:
    gear_rotation: false
    auto_expand: false
  open_graph:
    enable: true
    image:
    description: Tim Wang 的个人博客，记录技术、工具与日常思考。
  google_analytics:
    enable: false
    id:

fontawesome:
  thin: false
  light: false
  duotone: false
  sharp_solid: false

home_banner:
  enable: false

navbar:
  auto_hide: false
  color:
    left: "#3B5BDB"
    right: "#3B5BDB"
    transparency: 15
  width:
    home: 1200px
    pages: 1000px
  links:
    Home:
      path: /
      icon: fa-regular fa-house
    Archives:
      path: /archives
      icon: fa-regular fa-archive
    Tags:
      path: /tags
      icon: fa-regular fa-tags
    Categories:
      path: /categories
      icon: fa-regular fa-folder
    About:
      path: /about
      icon: fa-regular fa-user
  search:
    enable: true
    preload: true

home:
  sidebar:
    enable: true
    position: left
    first_item: info
    announcement:
    show_on_mobile: true
    links:
      Archives:
        path: /archives
        icon: fa-regular fa-archive
      Tags:
        path: /tags
        icon: fa-regular fa-tags
      Categories:
        path: /categories
        icon: fa-regular fa-folder
  article_date_format: YYYY-MM-DD
  excerpt_length: 160
  categories:
    enable: true
    limit: 2
  tags:
    enable: true
    limit: 3

articles:
  style:
    font_size: 16px
    line_height: 1.7
    image_border_radius: 10px
    image_alignment: center
    image_caption: true
    link_icon: false
    delete_mask: false
    title_alignment: left
    headings_top_spacing:
      h1: 3.2rem
      h2: 2.4rem
      h3: 1.9rem
      h4: 1.6rem
      h5: 1.4rem
      h6: 1.3rem
  word_count:
    enable: true
    count: true
    min2read: true
  author_label:
    enable: false
    auto: false
    list: []
  code_block:
    copy: true
    style: simple
    highlight_theme:
      light: github
      dark: github-dark
    font:
      enable: false
      family:
      url:
  toc:
    enable: true
    max_depth: 3
    number: false
    expand: true
    init_open: true
  copyright:
    enable: true
    default: cc_by_nc_sa
  lazyload: true
  pangu_js: true
  recommendation:
    enable: false

comment:
  enable: false
  system: giscus
  config:
    giscus:
      repo:
      repo_id:
      category:
      category_id:
      mapping: pathname
      strict: 0
      reactions_enabled: 1
      emit_metadata: 0
      lang: zh-CN
      input_position: bottom
      loading: lazy

footer:
  runtime: false
  icon: ''
  start: 2022/08/18 00:00:00
  statistics: true
  customize:
  icp:
    enable: false
    number:
    url:

inject:
  enable: false
  head:
  footer:

plugins:
  feed:
    enable: true
  aplayer:
    enable: false
  mermaid:
    enable: false

page_templates:
  friends_column: 2
  tags_style: blur
  masonry:
    batch_size: 12
    initial_batch_size: 24

cdn:
  enable: false
  provider: npmmirror
  custom_url:

developer:
  enable: false
